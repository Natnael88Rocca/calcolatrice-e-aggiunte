<!DOCTYPE html>
<html lang="it">
<body>

  <input type="number" id="num1" placeholder="Primo numero">
  
  <select id="operazione">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
  </select>

  <input type="number" id="num2" placeholder="Secondo numero">

  <button onclick="calcola()">=</button>

  <h3 id="risultato">Risultato: </h3>

  <script>
    function calcola() {
      const n1 = Number(document.getElementById('num1').value);
      const n2 = Number(document.getElementById('num2').value);
      const op = document.getElementById('operazione').value;
      
      let res = 0;

      switch (op) {
        case '+':
          res = n1 + n2;
          break;
        case '-':
          res = n1 - n2;
          break;
        case '*':
          res = n1 * n2;
          break;
        case '/':
          res = n2 !== 0 ? n1 / n2 : "Impossibile dividere per zero";
          break;
      }

      document.getElementById('risultato').innerText = "Risultato: " + res;
    }
  </script>

</body>
</html>
