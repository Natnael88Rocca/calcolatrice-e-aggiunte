<!DOCTYPE html>
<html lang="it">
<body>
  <input type="date" id="dataNascita">
  <br>
  <input type="checkbox" name="materia" value="Matematica"> Matematica
  <input type="checkbox" name="materia" value="Informatica"> Informatica
  <input type="checkbox" name="materia" value="Storia"> Storia
  <br>
  <button onclick="inviaDati()">Invia</button>

  <div id="out"></div>

  <script>
    function inviaDati() {
      const d = document.getElementById('dataNascita').value;
      const eta = d ? new Date(new Date() - new Date(d)).getFullYear() - 1970 : "N/D";
      const mat = Array.from(document.querySelectorAll('input[name="materia"]:checked')).map(c => c.value).join(', ');

      document.getElementById('out').innerHTML = `
        <table border="1">
          <tr><th>Età</th><th>Materie</th></tr>
          <tr><td>${eta}</td><td>${mat || 'Nessuna'}</td></tr>
        </table>`;
    }
  </script>
</body>
</html>
